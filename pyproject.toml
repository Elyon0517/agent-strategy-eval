[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "floweval-memory"
version = "0.1.0"
description = "Reproducible offline evaluation of memory and context strategies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Elyon Li"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.15,<2"]

[project.scripts]
floweval = "floweval.cli:main"

[project.urls]
Repository = "https://github.com/Elyon0517/agent-strategy-eval"
Issues = "https://github.com/Elyon0517/agent-strategy-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/floweval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/floweval"]
